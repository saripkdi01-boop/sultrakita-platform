<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
.slide-container{width:1280px;min-height:720px;background:#E2E8F0;color:#0F172A;padding:58px 72px 0;font-family:Arial,Helvetica,sans-serif;display:grid;grid-template-columns:repeat(12,1fr);gap:24px;position:relative}
.eyebrow{font-size:16px;letter-spacing:3px;font-weight:700;color:#DC2626;margin-bottom:30px}
.left{grid-column:1/8}
.title{font-size:70px;line-height:.96;font-weight:900;letter-spacing:-3px;margin:0 0 28px}
.subtitle{font-size:26px;line-height:1.25;color:#334155;max-width:600px}
.meta{margin-top:72px;border-top:1px solid #0F172A;padding-top:18px;font-size:15px;letter-spacing:1px}
.visual{grid-column:8/13;border:1px solid #0F172A;padding:10px;height:458px;background:#F8FAFC}
.visual img{width:100%;height:100%;object-fit:contain}
.marker{position:absolute;right:72px;bottom:46px;width:18px;height:18px;background:#DC2626}
</style>
</head>
<body>
<div class="slide-container">
  <section class="left">
    <div class="eyebrow">SULTRAKITA / RELEASE BRIEF</div>
    <h1 class="title">Upgrade<br>Master Prompt<br>v3</h1>
    <p class="subtitle">Dari marketplace lokal menuju <strong>social-commerce yang terpercaya</strong>.</p>
    <div class="meta">AUDIT BASELINE · HARDENING AWAL · PRODUCTION PATH<br>22 AGUSTUS 2026</div>
  </section>
  <figure class="visual">
    <img src="/home/ubuntu/upload/search_images/STK6aasFnAVU.jpg" alt="Konteks lokal Kendari dan Sulawesi Tenggara">
  </figure>
  <div class="marker"></div>
</div>
</body>
</html>
