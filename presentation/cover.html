<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box} body{margin:0}
.slide-container{width:1280px;min-height:720px;background:#fff;color:#1A1A1A;border:5px solid #1A1A1A;position:relative;font-family:Arial,sans-serif;padding:76px 82px}
.grid{display:grid;grid-template-columns:1.12fr .88fr;min-height:556px;align-items:center}
.eyebrow{font-size:16px;letter-spacing:4px;font-weight:800;text-transform:uppercase;color:#E63946;margin-bottom:28px}
.title{font-size:86px;line-height:.92;letter-spacing:-5px;font-weight:900;margin:0 0 28px;max-width:690px}
.subtitle{font-family:Georgia,serif;font-size:27px;line-height:1.35;max-width:580px;color:#333;margin:0}
.meta{margin-top:54px;font-size:15px;letter-spacing:1.2px;font-weight:700}
.visual{height:500px;border-left:6px solid #1A1A1A;position:relative;display:flex;align-items:center;justify-content:center}
.circle{position:absolute;border:6px solid #1A1A1A;border-radius:50%}.c1{width:360px;height:360px;right:38px;top:52px;background:#E63946}.c2{width:270px;height:270px;right:120px;top:126px;background:#fff}.c3{width:160px;height:160px;right:176px;top:181px;background:#1A1A1A}.monogram{position:relative;z-index:2;color:#fff;font-size:118px;font-weight:900;letter-spacing:-10px}.mark{position:absolute;right:34px;bottom:20px;font-family:Georgia,serif;font-size:17px}.corner{position:absolute;width:92px;height:92px;border-top:5px solid #E63946;border-right:5px solid #E63946;right:36px;top:36px}
</style>
</head>
<body>
<div class="slide-container"><div class="corner"></div><div class="grid"><div><div class="eyebrow">Rekapitulasi pengembangan platform</div><h1 class="title">SultraKita</h1><p class="subtitle">Marketplace lokal Kendari dan Sulawesi Tenggara</p><div class="meta">DARI PROTOTIPE HINGGA AUDIT LIGHTHOUSE</div></div><div class="visual"><div class="circle c1"></div><div class="circle c2"></div><div class="circle c3"></div><div class="monogram">S</div><div class="mark">Kendari · Sulawesi Tenggara · 2026</div></div></div></div>
</body>
</html>
