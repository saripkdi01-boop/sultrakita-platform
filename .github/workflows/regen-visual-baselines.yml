# SEKALI PAKAI — regenerasi baseline visual regression di CI.
# Sandbox lokal tidak bisa mengunduh browser Playwright, jadi update
# snapshot dijalankan di GitHub Actions (yang punya browser) lalu
# hasilnya di-commit kembali ke branch. Hapus file ini setelah dipakai.
name: Regen visual baselines (manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch yang baselinenya di-regenerasi'
        required: true
        default: 'upgrade/worldclass-execution'

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-visual-regression-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3200
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json
      - name: Install Next app dependencies
        working-directory: next-app
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: next-app
        run: npx playwright install --with-deps chromium
      - name: Regenerate baselines
        working-directory: next-app
        run: npm run test:visual:update
      - name: Upload new baselines (untuk review)
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: next-app/e2e/theme-visual.spec.ts-snapshots/
      - name: Commit & push updated baselines
        run: |
          git config user.name "muse-ci"
          git config user.email "muse-ci@local"
          git add next-app/e2e/theme-visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan baseline."
          else
            git commit -m "chore(test): regenerasi baseline visual regression (UI Fase 0-2 + worldclass)"
            git push origin "HEAD:${{ inputs.branch }}"
          fi
