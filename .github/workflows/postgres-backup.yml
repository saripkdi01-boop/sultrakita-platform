name: PostgreSQL backup

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check backup secrets
        id: check
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_S3_URI: ${{ secrets.BACKUP_S3_URI }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          missing=()
          [[ -n "$DATABASE_URL" ]] || missing+=(DATABASE_URL)
          [[ -n "$BACKUP_S3_URI" ]] || missing+=(BACKUP_S3_URI)
          [[ -n "$AWS_ACCESS_KEY_ID" ]] || missing+=(AWS_ACCESS_KEY_ID)
          [[ -n "$AWS_SECRET_ACCESS_KEY" ]] || missing+=(AWS_SECRET_ACCESS_KEY)
          [[ -n "$AWS_REGION" ]] || missing+=(AWS_REGION)
          if (( ${#missing[@]} > 0 )); then
            echo "::warning::PostgreSQL backup skipped; configure these repository secrets before enabling backups: ${missing[*]}"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  backup:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_S3_URI: ${{ secrets.BACKUP_S3_URI }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      BACKUP_RETENTION_DAYS: '30'
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Create and upload backup
        run: bash scripts/backup-postgres.sh
