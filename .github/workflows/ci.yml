name: SultraKita CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sultrakita_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d sultrakita_test"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sultrakita_test
      DATABASE_SSL: 'false'
      NODE_ENV: test
      CORS_ORIGINS: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - name: Verify migration idempotency
        run: npm run db:migrate
      - run: npm run lint
      - run: npm test
      - run: npm run test:security
      - run: npm run build
      - name: API smoke test
        run: npm run smoke:api
