name: SultraKita CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sultrakita_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d sultrakita_test"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sultrakita_test
      DATABASE_SSL: 'false'
      NODE_ENV: test
      CORS_ORIGINS: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare Supabase-compatible roles for migration tests
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN; END IF;
          END
          $$;
          CREATE OR REPLACE FUNCTION public.handle_new_user_profile() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
          CREATE OR REPLACE FUNCTION public.prevent_seller_publication_bypass() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
          CREATE OR REPLACE FUNCTION public.rls_auto_enable() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
          CREATE OR REPLACE FUNCTION public.update_property_stats() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
          CREATE OR REPLACE FUNCTION public.is_suki_jobs_manager() RETURNS boolean LANGUAGE sql AS $$ SELECT false $$;
          CREATE OR REPLACE FUNCTION public.set_updated_at() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN RETURN NEW; END $$;
          SQL
      - run: npm run db:migrate
      - name: Verify migration idempotency
        run: npm run db:migrate
      - run: npm run lint
      - run: npm test
      - name: Install Next.js app dependencies (security regression target)
        working-directory: next-app
        run: npm ci
      - name: Dependency audit (high and above)
        working-directory: next-app
        run: |
          npm audit --audit-level=high --json > /tmp/audit.json 2>&1 || true
          cat /tmp/audit.json | python3 -c "
          import json,sys
          try:
              d = json.load(sys.stdin)
              vulns = d.get('vulnerabilities', {})
              for k,v in vulns.items():
                  sev = v.get('severity', '')
                  if sev in ('high', 'critical'):
                      print(f\"VULN: {k} [{sev}] via {v.get('via', [{}])[0].get('title', '?')[:60]}\")
          except: print('Audit output parse failed')
          "
          npm audit --audit-level=high
      # Security regression menargetkan route next-app/ yang LIVE di Vercel
      # (bukan server Express legacy). GAGAL LOUD bila DB test tak tersedia —
      # tidak ada SKIP diam-diam. Butuh secrets SUPABASE_TEST_URL /
      # SUPABASE_TEST_ANON_KEY (project Supabase staging/test).
      - name: Security regression (live next-app routes)
        working-directory: next-app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
        run: npm run test:security
      - run: npm run build
      - name: API smoke test
        run: npm run smoke:api

  visual-regression:
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    # Fase 1.4: server Next.js fail-fast bila NEXT_PUBLIC_SUPABASE_URL /
    # NEXT_PUBLIC_SUPABASE_ANON_KEY kosong. Untuk regresi visual cukup nilai
    # dummy — yang diuji adalah konsistensi tema/UI, bukan data backend.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-visual-regression-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3200
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json
      - name: Install Next app dependencies
        working-directory: next-app
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: next-app
        run: npx playwright install --with-deps chromium
      - name: Run light/dark visual regression
        working-directory: next-app
        run: npm run test:visual
