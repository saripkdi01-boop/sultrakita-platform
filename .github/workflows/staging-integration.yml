name: SultraKita Staging Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-staging:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 25
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      DATABASE_SSL: 'true'
      NODE_ENV: staging
      CORS_ORIGINS: http://127.0.0.1:3000
      OTP_DEV_MODE: 'false'
      SEED_DEMO: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Require staging database secret
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo '::error::Configure STAGING_DATABASE_URL in GitHub Environment staging before running this workflow.'
            exit 1
          fi
      - run: npm ci
      - name: Apply migrations and verify idempotency
        run: |
          npm run db:migrate
          npm run db:migrate
      - run: npm run lint
      - run: npm test
      - name: Install Next.js app dependencies (security regression target)
        working-directory: next-app
        run: npm ci
      - name: Require staging Supabase secrets
        run: |
          if [[ -z "${{ secrets.STAGING_SUPABASE_URL }}" || -z "${{ secrets.STAGING_SUPABASE_ANON_KEY }}" ]]; then
            echo '::error::Configure STAGING_SUPABASE_URL and STAGING_SUPABASE_ANON_KEY in GitHub Environment staging before running this workflow.'
            exit 1
          fi
      - name: Security regression (live next-app routes)
        working-directory: next-app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: npm run test:security
      - run: npm run build
      - run: npm run smoke:api
      - name: Webhook replay smoke test
        run: node scripts/test-whatsapp-webhook.js
