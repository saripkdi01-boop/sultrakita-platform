name: Regenerate Visual Baselines (temporary)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to regenerate baselines for'
        required: true
        default: 'fix/visual-regression-determinism'

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-visual-regression-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3200
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json
      - name: Install dependencies
        working-directory: next-app
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: next-app
        run: npx playwright install --with-deps chromium
      - name: Regenerate baselines
        working-directory: next-app
        run: npx playwright test e2e/theme-visual.spec.ts --update-snapshots
      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add next-app/e2e/theme-visual.spec.ts-snapshots/
          git diff --staged --quiet || git commit -m "chore: regenerasi baseline visual-regression (via CI)"
          git push origin ${{ inputs.branch }}
