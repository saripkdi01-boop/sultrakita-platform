<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat SultraKita</title><style>body{font:15px system-ui;margin:0;background:#f7f5ed;color:#17231f}main{max-width:760px;margin:auto;padding:30px 18px}.box{background:#fff;border-radius:16px;padding:18px;box-shadow:0 8px 30px #17382d12}.setup{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.setup input,.composer input,button{padding:11px;border:1px solid #ccd9d0;border-radius:8px}button{background:#0d5c4b;color:#fff;cursor:pointer}.messages{min-height:360px;max-height:55vh;overflow:auto;padding:14px 0}.msg{padding:10px 13px;border-radius:12px;background:#edf5ea;margin:8px 0}.muted{color:#6b7c75}.composer{display:flex;gap:8px}.composer input{flex:1}@media(max-width:600px){.setup{grid-template-columns:1fr}.composer{display:grid}}
</style></head><body><main><p class="muted">SULTRAKITA · CHAT REALTIME</p><h1>Komunikasi aman sebelum transaksi</h1><div class="box"><div class="setup"><input id="listing" type="number" placeholder="ID listing"><input id="buyer" type="number" placeholder="ID buyer"><input id="seller" type="number" placeholder="ID seller"><button id="start">Mulai chat</button></div><div id="status" class="muted" style="margin-top:12px">Buat percakapan untuk mulai.</div><div id="messages" class="messages"></div><form class="composer" id="form"><input id="body" placeholder="Tulis pesan..." autocomplete="off"><button>Kirim</button></form></div></main><script>let conversationId=null,lastId=0,stream;const $=s=>document.querySelector(s);const call=(u,o={})=>fetch(u,{...o,headers:{'content-type':'application/json',...(o.headers||{})}}).then(async r=>{const b=await r.json();if(!r.ok)throw Error(b.error||'Gagal');return b});function add(m){$('#messages').insertAdjacentHTML('beforeend',`<div class="msg"><strong>${m.sender_name||'Pengguna'}</strong><br>${m.body}</div>`);$('#messages').scrollTop=$('#messages').scrollHeight}$('#start').onclick=async()=>{try{const b=await call('/api/conversations',{method:'POST',body:JSON.stringify({listing_id:Number($('#listing').value)||null,buyer_id:Number($('#buyer').value),seller_id:Number($('#seller').value)})});conversationId=b.data.id;const history=await call(`/api/conversations/${conversationId}/messages`);history.data.forEach(add);stream=new EventSource(`/api/conversations/${conversationId}/stream?after=${lastId}`);stream.onmessage=e=>add(JSON.parse(e.data));$('#status').textContent=`Percakapan #${conversationId} aktif realtime.`}catch(e){$('#status').textContent=e.message}};$('#form').onsubmit=async e=>{e.preventDefault();if(!conversationId||!$('#body').value.trim())return;await call(`/api/conversations/${conversationId}/messages`,{method:'POST',body:JSON.stringify({sender_id:Number($('#buyer').value),body:$('#body').value})});$('#body').value=''};</script></body></html>
