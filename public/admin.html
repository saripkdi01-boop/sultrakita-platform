<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SultraKita Admin</title><style>body{font:15px system-ui;margin:0;background:#f7f5ed;color:#17231f}main{max-width:1100px;margin:auto;padding:32px 20px}header{display:flex;justify-content:space-between;align-items:center}h1{color:#0d5c4b}.toolbar{display:flex;gap:10px;margin:20px 0}.toolbar input,button{padding:11px;border-radius:8px;border:1px solid #ccd9d0}button{cursor:pointer;background:#0d5c4b;color:#fff}.metrics,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric,.panel{background:#fff;border-radius:14px;padding:18px;box-shadow:0 6px 20px #17382d12}.metric strong{font-size:30px;color:#0d5c4b;display:block}.panel{margin-top:20px}.row{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #e6ece8;padding:14px 0}.muted{color:#6b7c75}@media(max-width:700px){.metrics{grid-template-columns:repeat(2,1fr)}.row{display:block}.row button{margin-top:8px}}</style></head><body><main><header><div><p class="muted">OPERATIONS CENTER</p><h1>SultraKita Admin</h1></div><a href="/">Kembali ke marketplace</a></header><div class="toolbar"><input id="token" type="password" placeholder="ADMIN_TOKEN"><button id="load">Muat dashboard</button></div><section class="metrics" id="metrics"></section><section class="panel"><h2>Verifikasi seller</h2><div id="verifications" class="muted">Masukkan admin token untuk memuat data.</div></section><section class="panel"><h2>Laporan marketplace</h2><div id="reports" class="muted">Masukkan admin token untuk memuat data.</div></section></main><script>const $=s=>document.querySelector(s);const call=(u,o={})=>fetch(u,{...o,headers:{'content-type':'application/json','x-admin-token':$('#token').value,...(o.headers||{})}}).then(async r=>{const b=await r.json();if(!r.ok)throw Error(b.error||'Gagal');return b});async function load(){try{const [overview,verifications,reports]=await Promise.all([call('/api/admin/overview'),call('/api/admin/verifications'),call('/api/admin/reports')]);$('#metrics').innerHTML=Object.entries(overview.data).map(([k,v])=>`<article class="metric"><span class="muted">${k.replaceAll('_',' ')}</span><strong>${v}</strong></article>`).join('');$('#verifications').innerHTML=verifications.data.length?verifications.data.map(x=>`<div class="row"><div><strong>${x.name}</strong><br><span class="muted">${x.phone} · ${x.district} · ${x.document_type}</span></div><button data-id="${x.id}" data-kind="verification">Setujui</button></div>`).join(''):'Tidak ada antrean verifikasi.';$('#reports').innerHTML=reports.data.length?reports.data.map(x=>`<div class="row"><div><strong>${x.title||'Listing'}</strong><br><span class="muted">${x.reason}</span></div><button data-id="${x.id}" data-kind="report">Selesaikan</button></div>`).join(''):'Tidak ada laporan terbuka.';}catch(e){alert(e.message)}}$('#load').onclick=load;document.addEventListener('click',async e=>{if(!e.target.dataset.id)return;const kind=e.target.dataset.kind;const url=kind==='verification'?`/api/admin/verifications/${e.target.dataset.id}`:`/api/admin/reports/${e.target.dataset.id}`;await call(url,{method:'PATCH',body:JSON.stringify({status:kind==='verification'?'approved':'resolved'})});load()});</script></body></html>
