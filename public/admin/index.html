<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — SultraKita</title><link rel="stylesheet" href="/admin/css/admin.css?v=1"><link rel="stylesheet" href="/admin/css/admin-dark.css?v=1"></head><body><main id="admin-main" class="admin-content" tabindex="-1"><section class="admin-card" style="max-width:540px;margin:5vh auto"><div class="admin-brand" style="color:var(--admin-forest)"><span class="admin-mark">S</span><span>SultraKita Admin</span></div><h1>Akses Operations Center</h1><p>Gunakan session bearer dan admin token yang sudah diterbitkan oleh administrator platform. Credential tidak disimpan di server atau URL.</p><form id="login-form" class="admin-form-grid"><div class="admin-field full"><label for="session">Session bearer</label><input id="session" class="admin-input" type="password" autocomplete="off" required></div><div class="admin-field full"><label for="admin-token">Admin token</label><input id="admin-token" class="admin-input" type="password" autocomplete="off" required></div><div class="admin-field full"><button class="admin-button" type="submit">Verifikasi akses</button></div></form><p class="admin-status" data-status></p><p><a href="/">Kembali ke marketplace</a></p></section></main><script src="/admin/js/api.js?v=1"></script><script src="/admin/js/auth.js?v=1"></script><script src="/admin/js/components.js?v=1"></script><script>(()=>{const form=document.querySelector('#login-form');form.addEventListener('submit',async event=>{event.preventDefault();const button=form.querySelector('button');button.disabled=true;try{AdminApi.setCredentials(document.querySelector('#session').value,document.querySelector('#admin-token').value);await AdminAuth.loadMe();location.href='/admin/dashboard.html'}catch(error){AdminUi.setStatus(error.message,true);button.disabled=false}})})();</script></body></html>
